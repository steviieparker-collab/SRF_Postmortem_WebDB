<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PV Explorer — {{ event.id }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body { background:#0d1117; color:#e6edf3; font-size:.9rem; }
        .card { background:#161b22; border-color:#30363d; }
        .card-header { background:#1c2128; border-bottom:1px solid #30363d; }
        .form-control, .form-select { background:#0d1117; border-color:#30363d; color:#e6edf3; }
        .form-control:focus, .form-select:focus { border-color:#58a6ff; box-shadow:0 0 0 .15rem rgba(88,166,255,.3); }
        .pv-list { max-height:420px; overflow-y:auto; }
        .pv-row:hover { background:#1c2128; }
        ::-webkit-scrollbar { width:6px; }
        ::-webkit-scrollbar-thumb { background:#30363d; border-radius:3px; }
        .time-range-label { min-width:150px; }
        .stamp-row { border-bottom:1px solid #21262d; }
    </style>
</head>
<body>
<div class="container-fluid py-3">
    <div class="d-flex align-items-center mb-3 gap-2">
        <a href="{{ back_url }}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i></a>
        <h5 class="mb-0">{{ event.id }}</h5>
        <span class="text-secondary">{{ event.timestamp }}</span>
        <span class="badge bg-info">PV Explorer (test)</span>
        <div class="ms-auto d-flex align-items-center gap-2">
            <button class="btn btn-sm btn-success" onclick="saveNotes()">
                <i class="bi bi-save"></i> Save notes
            </button>
            <span class="small" id="save-status"></span>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-md-4">
            <div class="card">
                <div class="card-header py-1"><strong>PV selection</strong></div>
                <div class="card-body py-2">
                    <div class="row g-2 mb-2">
                        <div class="col-6"><select id="class-select" class="form-select form-select-sm"></select></div>
                        <div class="col-6"><select id="sub-select" class="form-select form-select-sm"></select></div>
                    </div>
                    <input id="pv-search" class="form-control form-control-sm mb-2"
                           placeholder="description / PV 검색">
                    <div class="small text-secondary mb-1" id="pv-count"></div>
                    <div id="pv-list" class="pv-list border border-secondary rounded p-1"></div>
                </div>
            </div>
            <div class="card mt-3">
                <div class="card-header py-1"><strong>Selected PV</strong></div>
                <div class="card-body py-2 small" id="selected-list">없음</div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card mb-2">
                <div class="card-body py-2 d-flex flex-wrap align-items-center gap-2">
                    <span class="small text-secondary">Time axis</span>
                    <div class="btn-group btn-group-sm" role="group" aria-label="Time axis controls">
                        <button type="button" class="btn btn-outline-secondary" onclick="panTime(-0.25)"
                                title="왼쪽으로 이동"><i class="bi bi-arrow-left"></i></button>
                        <button type="button" class="btn btn-outline-secondary" onclick="zoomTime(0.5)"
                                title="확대"><i class="bi bi-zoom-in"></i></button>
                        <button type="button" class="btn btn-outline-secondary" onclick="zoomTime(2)"
                                title="축소"><i class="bi bi-zoom-out"></i></button>
                        <button type="button" class="btn btn-outline-secondary" onclick="panTime(0.25)"
                                title="오른쪽으로 이동"><i class="bi bi-arrow-right"></i></button>
                    </div>
                    <button type="button" class="btn btn-sm btn-outline-info" onclick="resetTime()">Reset</button>
                    <span class="small font-monospace text-secondary time-range-label"
                          id="time-range-label">-600s ~ +200s</span>
                    <span class="small text-secondary ms-auto">휠 확대/축소 · 드래그 이동 · 최소 -6s ~ +2s</span>
                </div>
            </div>

            <div id="charts">
                <div class="text-secondary small p-2">PV를 선택하면 그래프가 표시됩니다.</div>
            </div>
            <div class="text-secondary small mt-2" id="pv-stack-hint"></div>

            <div class="card mt-3">
                <div class="card-header py-1"><strong>Integrated note</strong></div>
                <div class="card-body py-2">
                    <textarea id="explorer-note" class="form-control form-control-sm" rows="4"
                              placeholder="이벤트 전체에 대한 note (모든 PV 그래프 공통)"></textarea>
                    <div class="small text-secondary mt-1">기존 PV별 note는 저장 시 삭제됩니다.</div>
                </div>
            </div>

            <div class="card mt-3">
                <div class="card-header py-1 d-flex justify-content-between align-items-center">
                    <strong>Timeline stamps</strong>
                    <span class="small text-secondary" id="stamp-count"></span>
                </div>
                <div class="card-body py-2">
                    <div class="d-flex flex-wrap gap-2 align-items-end mb-2">
                        <div>
                            <label class="form-label small mb-0" for="stamp-x">x (초)</label>
                            <input id="stamp-x" type="number" step="0.1" class="form-control form-control-sm"
                                   style="width:110px" placeholder="-0.2">
                        </div>
                        <div class="flex-grow-1" style="min-width:180px;">
                            <label class="form-label small mb-0" for="stamp-text">note</label>
                            <input id="stamp-text" class="form-control form-control-sm"
                                   placeholder="예: HVPS trip">
                        </div>
                        <button type="button" class="btn btn-sm btn-outline-warning" onclick="addStamp()">
                            <i class="bi bi-pin-angle"></i> Add stamp
                        </button>
                    </div>
                    <div class="small text-secondary mb-1">데이터 점을 클릭하면 x 값이 자동으로 입력됩니다.</div>
                    <div id="stamp-list" class="small text-secondary">아직 스탬프가 없습니다.</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const EVENT_ID = '{{ event.id }}';
let hierarchy = null;
let currentItems = [];
let selected = new Map();   // pv -> {pv, description, unit}
const dataCache = new Map();
const MAX_PVS = 8;          // matches the event page's selection limit

// ── Time-axis state ───────────────────────────────────
const FULL_RANGE = { x0: -600, x1: 200 };
const MIN_SPAN = 8;          // -6s ~ +2s
const DATA_PRE = 600;
const DATA_POST = 200;
let viewRange = { ...FULL_RANGE };
let renderedPanelCount = 0;
let renderSeq = 0;
let stamps = [];

// ── Plot geometry / colors ────────────────────────────
const PV_PANEL_PX = 127;      // 2/3 of the previous 190px
const PV_PANEL_GAP = 18;
const PV_MARGIN = { l: 70, r: 20, t: 38, b: 48 };
const PV_COLORS = ['#58a6ff', '#ff922b', '#69db7c', '#da77f2', '#ffd43b'];
const BG_COLOR = '#161b22';
const PLOT_BG = '#0d1117';
const GRID_COLOR = '#21262d';
const AXIS_COLOR = '#8b949e';
const BOX_COLOR = '#30363d';

function escHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
}

async function jget(url) {
    const r = await fetch(url);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
}

// The event page's alarm snapshot pairs graph PVs with their descriptions.
// Use it to fill descriptions for PVs that arrive without one (deep link).
async function loadDescriptionMap() {
    const map = new Map();
    try {
        const doc = await jget(`/api/events/${encodeURIComponent(EVENT_ID)}/alarms`);
        for (const item of (doc.items || [])) {
            (item.graph_pv || []).forEach((pv, idx) => {
                const desc = (item.graph_description || [])[idx];
                if (desc) map.set(pv, desc);
            });
            if (item.pv && item.description) map.set(item.pv, item.description);
        }
    } catch (e) { /* alarm data is optional */ }
    return map;
}

function readUrlPvs(params) {
    const out = [];
    const pvParams = params.getAll('pv');
    const descParams = params.getAll('desc');
    if (pvParams.length) {
        for (let i = 0; i < pvParams.length; i++) {
            const pv = (pvParams[i] || '').trim();
            if (pv) out.push({pv, desc: descParams[i] || ''});
        }
    } else {
        const pvsParam = params.get('pvs');
        if (pvsParam) {
            for (const pv of pvsParam.split(',').map(s => s.trim()).filter(Boolean)) {
                out.push({pv, desc: ''});
            }
        }
    }
    return out;
}

function tokenizePv(value) {
    return String(value || '').toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean);
}

// Alarm graph PVs in the RF family map onto archiver sub codes with a
// different spelling (CRM1 -> RF_CM1, CRG_COMP -> RF_CRG, ...).
const SUB_ALIASES = {
    KSU1: 'RF_KSU1', KSU2: 'RF_KSU2', KSU3: 'RF_KSU3',
    CRM1: 'RF_CM1', CRM2: 'RF_CM2', CRM3: 'RF_CM3',
    CM1: 'RF_CM1', CM2: 'RF_CM2', CM3: 'RF_CM3',
    CRG: 'RF_CRG', LLRF: 'RF_LLRF',
};

function matchSubForPv(pv, subs) {
    const tokens = new Set(tokenizePv(pv));
    const byCode = new Map(subs.map(s => [String(s.code).toUpperCase(), String(s.code)]));

    // Known alarm graph-PV families.
    for (const token of tokens) {
        const alias = SUB_ALIASES[token];
        if (alias && byCode.has(alias)) return byCode.get(alias);
    }

    // Generic fallback: require at least two matched sub tokens (or one long
    // single-token sub) so a lone "RF" does not pick an arbitrary group.
    let best = null;
    let bestScore = 0;
    for (const sub of subs) {
        const code = String(sub.code);
        const subTokens = tokenizePv(code);
        let matched = 0;
        for (const t of subTokens) {
            if (tokens.has(t)) { matched += 1; continue; }
            if (t.length >= 3 && [...tokens].some(pt => pt.startsWith(t) || t.startsWith(pt))) {
                matched += 0.5;
            }
        }
        const singleLong = subTokens.length === 1 && subTokens[0].length >= 4 && matched >= 1;
        if (matched < 1.5 && !singleLong) continue;
        if (matched > bestScore || (matched === bestScore && best && code.length > best.length)) {
            best = code;
            bestScore = matched;
        }
    }
    return best;
}

function pickGroupForPvs(pvs) {
    if (!hierarchy || !Array.isArray(pvs) || !pvs.length) return null;
    const classes = hierarchy?.data?.classes || [];
    const classSubs = hierarchy?.data?.classSubs || [];
    for (const raw of pvs) {
        const pv = String(raw || '').trim().toUpperCase();
        if (!pv) continue;
        const head = pv.split(':')[0];
        const cls = classes.find(c => String(c.code).toUpperCase() === head)
            || classes.find(c => pv.startsWith(String(c.code).toUpperCase()))
            || classes.find(c => String(c.code).toUpperCase() === 'SR');
        if (!cls) continue;
        const subs = classSubs.filter(s => s.classCode === cls.code);
        const subCode = matchSubForPv(pv, subs);
        if (subCode) return {classCode: cls.code, subCode};
    }
    return null;
}

async function loadHierarchy(candidatePvs = []) {
    hierarchy = await jget('/api/pv-hierarchy');
    const classes = hierarchy?.data?.classes || [];
    const cs = document.getElementById('class-select');
    cs.innerHTML = classes.map(c => `<option value="${c.code}">${c.name}</option>`).join('');
    const target = pickGroupForPvs(candidatePvs);
    cs.value = target?.classCode || 'SR';
    cs.onchange = () => { fillSubs(); loadPvs(); };
    fillSubs();
    if (target?.subCode) {
        const ss = document.getElementById('sub-select');
        if ([...ss.options].some(o => o.value === target.subCode)) ss.value = target.subCode;
    }
    await loadPvs();
}

function fillSubs() {
    const cls = document.getElementById('class-select').value;
    const subs = (hierarchy?.data?.classSubs || []).filter(s => s.classCode === cls);
    const ss = document.getElementById('sub-select');
    ss.innerHTML = subs.map(s => `<option value="${s.code}">${s.name}</option>`).join('');
    const bs = subs.find(s => s.code === 'Beam Status');
    if (bs) ss.value = 'Beam Status';
    ss.onchange = loadPvs;
}

async function loadPvs() {
    const cls = document.getElementById('class-select').value;
    const sub = document.getElementById('sub-select').value;
    if (!cls || !sub) return;
    try {
        const d = await jget(`/api/pv-list?class=${encodeURIComponent(cls)}&sub=${encodeURIComponent(sub)}`);
        currentItems = d?.data?.items || [];
        renderPvList();
    } catch (e) {
        document.getElementById('pv-list').innerHTML =
            `<div class="text-danger small p-2">PV 목록을 불러오지 못했습니다: ${escHtml(e)}</div>`;
    }
}

function renderPvList() {
    const q = document.getElementById('pv-search').value.toLowerCase();
    const items = currentItems.filter(x =>
        !q || (x.description || '').toLowerCase().includes(q) ||
        (x.pvKey || '').toLowerCase().includes(q));
    document.getElementById('pv-count').textContent = `${items.length} / ${currentItems.length} PV`;
    const box = document.getElementById('pv-list');
    box.innerHTML = items.map(x => `
        <label class="d-flex align-items-start gap-2 py-1 px-1 border-bottom border-dark pv-row">
            <input type="checkbox" class="form-check-input mt-1 pv-check"
                   data-pv="${escHtml(x.pvKey)}" data-desc="${escHtml(x.description || '')}"
                   data-unit="${escHtml(x.unit || '')}"
                   ${selected.has(x.pvKey) ? 'checked' : ''}>
            <span>
                <span class="small">${escHtml(x.description || x.pvKey)}</span>
                <span class="text-secondary font-monospace d-block" style="font-size:.7rem">${escHtml(x.pvKey)}</span>
            </span>
        </label>`).join('');
    box.querySelectorAll('.pv-check').forEach(cb => cb.onchange = () => togglePv(cb));
}

async function togglePv(cb) {
    const pv = cb.dataset.pv;
    if (cb.checked) {
        if (selected.size >= MAX_PVS) {
            cb.checked = false;
            alert(`최대 ${MAX_PVS}개 PV까지 선택할 수 있습니다.`);
            return;
        }
        selected.set(pv, {pv, description: cb.dataset.desc || '', unit: cb.dataset.unit || ''});
        await ensureData(pv);
    } else {
        selected.delete(pv);
    }
    renderSelected();
    saveSelection();
    await renderCharts();
}

function removePv(pv) {
    selected.delete(pv);
    document.querySelectorAll('.pv-check').forEach(cb => {
        if (cb.dataset.pv === pv) cb.checked = false;
    });
    renderSelected();
    saveSelection();
    renderCharts();
}

async function ensureData(pv) {
    if (dataCache.has(pv)) return dataCache.get(pv);
    try {
        const d = await jget(
            `/api/pv-data?event_id=${encodeURIComponent(EVENT_ID)}` +
            `&pv=${encodeURIComponent(pv)}&pre=${DATA_PRE}&post=${DATA_POST}`);
        dataCache.set(pv, d);
        return d;
    } catch (e) {
        const d = {available: false, reason: String(e), points: []};
        dataCache.set(pv, d);
        return d;
    }
}

function renderSelected() {
    const el = document.getElementById('selected-list');
    if (!selected.size) { el.textContent = '없음'; return; }
    el.innerHTML = [...selected.values()].map(x => `
        <div class="d-flex justify-content-between align-items-center py-1">
            <span class="me-2">
                <span class="font-monospace">${escHtml(x.pv)}</span><br>
                <span class="text-secondary">${escHtml(x.description || '(description 없음)')}</span>
            </span>
            <button type="button" class="btn btn-sm btn-outline-danger py-0 px-2"
                    data-remove-pv="${escHtml(x.pv)}">×</button>
        </div>`).join('');
    el.querySelectorAll('[data-remove-pv]').forEach(btn => {
        btn.onclick = () => removePv(btn.dataset.removePv);
    });
}

function scrollFirstSelectedPv() {
    const cb = document.querySelector('#pv-list .pv-check:checked');
    if (cb) cb.closest('label')?.scrollIntoView({block: 'nearest'});
}

// ── Time axis ─────────────────────────────────────────
function fmtSec(v) {
    const n = Number(v);
    return Math.abs(n - Math.round(n)) < 1e-9 ? String(Math.round(n)) : n.toFixed(1);
}

function updateRangeLabel() {
    const el = document.getElementById('time-range-label');
    if (el) el.textContent = `${fmtSec(viewRange.x0)}s ~ ${fmtSec(viewRange.x1)}s`;
}

function applyViewRange() {
    updateRangeLabel();
    const plotDiv = document.getElementById('pv-stack-plot');
    if (!plotDiv || !plotDiv.data || !renderedPanelCount) return;
    // xaxis2..xaxisN use matches:'x', so updating the shared axis moves them all.
    Plotly.relayout(plotDiv, {'xaxis.range': [viewRange.x0, viewRange.x1]});
}

function zoomTime(factor) {
    const span = viewRange.x1 - viewRange.x0;
    if (!isFinite(span) || span <= 0) return;
    const anchor = (viewRange.x0 <= 0 && 0 <= viewRange.x1)
        ? 0 : (viewRange.x0 + viewRange.x1) / 2;
    let n0 = anchor + (viewRange.x0 - anchor) * factor;
    let n1 = anchor + (viewRange.x1 - anchor) * factor;

    if (n1 - n0 >= FULL_RANGE.x1 - FULL_RANGE.x0) {
        n0 = FULL_RANGE.x0;
        n1 = FULL_RANGE.x1;
    } else if (n1 - n0 < MIN_SPAN) {
        // Snap exactly to the 8-second minimum, keeping the anchor fixed.
        const s = MIN_SPAN / (n1 - n0);
        n0 = anchor + (n0 - anchor) * s;
        n1 = anchor + (n1 - anchor) * s;
    }

    if (n0 < FULL_RANGE.x0) { n1 += FULL_RANGE.x0 - n0; n0 = FULL_RANGE.x0; }
    if (n1 > FULL_RANGE.x1) { n0 -= n1 - FULL_RANGE.x1; n1 = FULL_RANGE.x1; }
    viewRange = {x0: n0, x1: n1};
    applyViewRange();
}

function panTime(frac) {
    const span = viewRange.x1 - viewRange.x0;
    if (!isFinite(span) || span <= 0) return;
    const shift = span * frac;
    let n0 = viewRange.x0 + shift;
    let n1 = viewRange.x1 + shift;
    if (n0 < FULL_RANGE.x0) { n1 += FULL_RANGE.x0 - n0; n0 = FULL_RANGE.x0; }
    if (n1 > FULL_RANGE.x1) { n0 -= n1 - FULL_RANGE.x1; n1 = FULL_RANGE.x1; }
    viewRange = {x0: n0, x1: n1};
    applyViewRange();
}

function resetTime() {
    viewRange = { ...FULL_RANGE };
    applyViewRange();
}

// ── Timeline stamps ───────────────────────────────────
function renderStampList() {
    const el = document.getElementById('stamp-list');
    const countEl = document.getElementById('stamp-count');
    if (countEl) countEl.textContent = stamps.length ? `${stamps.length} stamps` : '';
    if (!stamps.length) {
        el.textContent = '아직 스탬프가 없습니다.';
        return;
    }
    el.innerHTML = stamps.map((s, i) => `
        <div class="d-flex justify-content-between align-items-center gap-2 py-1 stamp-row">
            <span class="font-monospace text-warning">${fmtSec(s.x)}s</span>
            <span class="flex-grow-1">${escHtml(s.text || '')}</span>
            <button type="button" class="btn btn-sm btn-outline-danger py-0 px-2"
                    data-remove-stamp="${i}">×</button>
        </div>`).join('');
    el.querySelectorAll('[data-remove-stamp]').forEach(btn => {
        btn.onclick = () => removeStamp(Number(btn.dataset.removeStamp));
    });
}

function addStamp() {
    const xEl = document.getElementById('stamp-x');
    const textEl = document.getElementById('stamp-text');
    const raw = (xEl.value || '').trim();
    const x = Number(raw);
    if (raw === '' || !isFinite(x)) {
        alert('x 값을 초 단위 숫자로 입력하세요.');
        return;
    }
    const text = (textEl.value || '').trim();
    stamps.push({x, text: text || `t=${fmtSec(x)}s`});
    stamps.sort((a, b) => a.x - b.x);
    xEl.value = '';
    textEl.value = '';
    renderStampList();
    renderCharts();
}

function removeStamp(idx) {
    stamps.splice(idx, 1);
    renderStampList();
    renderCharts();
}

// ── Stacked PV chart ──────────────────────────────────
async function renderCharts() {
    const seq = ++renderSeq;
    const box = document.getElementById('charts');
    const hint = document.getElementById('pv-stack-hint');
    const items = [...selected.values()];

    if (!items.length) {
        renderedPanelCount = 0;
        box.innerHTML = '<div class="text-secondary small p-2">PV를 선택하면 그래프가 표시됩니다.</div>';
        hint.textContent = '';
        return;
    }

    box.innerHTML = '<div class="text-secondary small p-2">그래프를 불러오는 중…</div>';
    const datas = await Promise.all(items.map(it => ensureData(it.pv)));
    if (seq !== renderSeq) return;

    // Fill units from the archiver metadata when the PV list did not have one.
    items.forEach((it, i) => {
        const d = datas[i] || {};
        if (!it.unit && d.unit) it.unit = d.unit;
    });

    const count = items.length;
    const plotArea = count * PV_PANEL_PX + (count - 1) * PV_PANEL_GAP;
    const height = plotArea + PV_MARGIN.t + PV_MARGIN.b;

    const slots = [];
    let cursor = plotArea;
    for (let i = 0; i < count; i++) {
        const bottom = cursor - PV_PANEL_PX;
        slots.push({
            item: items[i],
            data: datas[i] || {},
            domain: [bottom / plotArea, cursor / plotArea],
            xId: i === 0 ? 'x' : `x${i + 1}`,
            yId: i === 0 ? 'y' : `y${i + 1}`,
        });
        cursor = bottom - PV_PANEL_GAP;
    }

    box.innerHTML = '<div class="card"><div class="card-body p-1">' +
        '<div id="pv-stack-plot"></div></div></div>';
    const plotDiv = document.getElementById('pv-stack-plot');
    plotDiv.style.height = height + 'px';
    renderedPanelCount = count;

    const traces = [];
    const shapes = [
        {type:'rect', xref:'x', yref:'paper', x0: FULL_RANGE.x0, x1: 0,
         y0:0, y1:1, fillcolor:'rgba(88,166,255,0.07)', line:{width:0}},
        {type:'rect', xref:'x', yref:'paper', x0: 0, x1: FULL_RANGE.x1,
         y0:0, y1:1, fillcolor:'rgba(248,81,73,0.08)', line:{width:0}},
        {type:'line', xref:'x', yref:'paper', x0: 0, x1: 0,
         y0:0, y1:1, line:{color:'#f85149', width:2, dash:'dash'}},
    ];
    const annotations = [];

    slots.forEach((slot, i) => {
        const it = slot.item;
        const d = slot.data;
        const pts = (d.available && Array.isArray(d.points)) ? d.points : [];
        const desc = it.description || it.pv;
        const unit = d.unit || it.unit || '';
        const label = unit ? `${desc} [${unit}]` : desc;

        // Panel label: description is the primary identifier.
        annotations.push({
            xref:'paper', yref:'paper',
            x: 0.006, y: slot.domain[1] - 0.008,
            xanchor:'left', yanchor:'top',
            text: `<b>${escHtml(label)}</b>`,
            showarrow:false,
            font:{color:'#e6edf3', size:11},
            bgcolor:'rgba(13,17,23,0.60)',
            borderpad:2,
        });

        if (pts.length) {
            traces.push({
                x: pts.map(p => p[0]),
                y: pts.map(p => p[1]),
                type:'scatter', mode:'lines',
                name: desc,
                line:{color: PV_COLORS[i % PV_COLORS.length], width:1.5},
                hovertemplate:
                    `${escHtml(desc)}<br>${escHtml(it.pv)}` +
                    `<br>t=%{x:.2f}s · %{y:.4f} ${escHtml(unit)}<extra></extra>`,
                xaxis: slot.xId,
                yaxis: slot.yId,
                showlegend:false,
            });
        } else {
            annotations.push({
                xref:'paper', yref:'paper',
                x: 0.5, y: (slot.domain[0] + slot.domain[1]) / 2,
                text:'no data', showarrow:false,
                font:{color:'#8b949e', size:11},
            });
        }
    });

    // Full-height vertical lines + ribbon labels above the panels.
    stamps.forEach((s, i) => {
        const x = Number(s.x);
        if (!isFinite(x)) return;
        shapes.push({
            type:'line', xref:'x', yref:'paper', x0:x, x1:x, y0:0, y1:1,
            line:{color:'#d29922', width:1.5, dash:'dot'},
        });
        annotations.push({
            xref:'x', yref:'paper', x:x, y:1.0, yanchor:'bottom',
            xanchor:'left', align:'left',
            text: escHtml(s.text || `t=${fmtSec(x)}s`),
            showarrow:false,
            bgcolor:'rgba(210,153,34,0.92)',
            bordercolor:'#d29922', borderwidth:1, borderpad:2,
            font:{color:'#0d1117', size:9},
            yshift: (i % 3) * 9,
        });
    });

    const layout = {
        height,
        paper_bgcolor: BG_COLOR,
        plot_bgcolor: PLOT_BG,
        font:{color: AXIS_COLOR, size:11},
        margin:{...PV_MARGIN},
        hovermode:'closest',
        dragmode:'pan',
        doubleclick:false,
        showlegend:false,
        shapes,
        annotations,
    };

    slots.forEach((slot, i) => {
        const yKey = i === 0 ? 'yaxis' : `yaxis${i + 1}`;
        const xKey = i === 0 ? 'xaxis' : `xaxis${i + 1}`;
        layout[yKey] = {
            domain: slot.domain,
            anchor: slot.xId,
            gridcolor: GRID_COLOR,
            zerolinecolor: BOX_COLOR,
            color: AXIS_COLOR,
            automargin:true,
            showline:true, mirror:true, linecolor:BOX_COLOR, linewidth:1,
            fixedrange:true,
        };
        layout[xKey] = {
            anchor: slot.yId,
            gridcolor: GRID_COLOR,
            zerolinecolor: BOX_COLOR,
            color: AXIS_COLOR,
            automargin:true,
            showline:true, mirror:true, linecolor:BOX_COLOR, linewidth:1,
            showticklabels: i === count - 1,
            title: i === count - 1 ? {text:'t0 기준 시간 (초)', font:{size:10}} : {text:''},
            ...(i === 0 ? {range:[viewRange.x0, viewRange.x1]} : {matches:'x'}),
        };
    });

    await Plotly.newPlot(plotDiv, traces, layout, {
        responsive:true,
        displayModeBar:false,
        scrollZoom:true,
        displaylogo:false,
    });

    // Wheel zoom / drag pan changes the range directly in Plotly; mirror it
    // back into viewRange so a later re-render keeps the current view.
    plotDiv.on('plotly_relayout', ev => {
        let r0 = ev['xaxis.range[0]'];
        let r1 = ev['xaxis.range[1]'];
        if (!Number.isFinite(r0) || !Number.isFinite(r1)) {
            const range = ev['xaxis.range'];
            if (Array.isArray(range) && range.length === 2) {
                r0 = range[0];
                r1 = range[1];
            }
        }
        if (Number.isFinite(r0) && Number.isFinite(r1)) {
            viewRange = {x0: r0, x1: r1};
            updateRangeLabel();
        } else if (ev['xaxis.autorange']) {
            viewRange = {...FULL_RANGE};
            updateRangeLabel();
        }
    });

    // Clicking anywhere on a trace prefills the stamp x value.
    plotDiv.on('plotly_click', ev => {
        const p = (ev.points || [])[0];
        if (!p || typeof p.x !== 'number') return;
        const input = document.getElementById('stamp-x');
        if (input) input.value = Number(p.x).toFixed(2);
    });

    const firstAvail = datas.find(d => d && d.available && d.t0_offset_sec != null);
    hint.textContent = firstAvail
        ? `0초 = 빔전류 최대값 하강 시작 (이벤트 기준 ${Number(firstAvail.t0_offset_sec).toFixed(3)}초) · Archiver 초 단위`
        : '선택한 PV의 데이터가 없습니다.';
}

// ── Save / load ───────────────────────────────────────
// The selection is shared with the event page's Alarm Messages & PV panel.
// Note and timeline stamps stay in the pv-notes sidecar.
let selectionSaveChain = Promise.resolve();

function saveSelection() {
    const items = [...selected.values()].map(x => ({
        pv: x.pv,
        description: x.description || '',
        unit: x.unit || '',
    }));
    const job = async () => {
        try {
            const r = await fetch(`/api/events/${encodeURIComponent(EVENT_ID)}/pv-selection`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({items})
            });
            return r.ok;
        } catch (e) {
            return false;
        }
    };
    selectionSaveChain = selectionSaveChain.then(job, job);
    return selectionSaveChain;
}

async function saveNotes() {
    const items = [...selected.values()].map(x => ({
        pv: x.pv,
        description: x.description || '',
        unit: x.unit || '',
    }));
    const note = document.getElementById('explorer-note')?.value || '';
    const stampsPayload = stamps.map(s => ({x: Number(s.x), text: String(s.text || '')}));
    const st = document.getElementById('save-status');
    try {
        // Persist the selection in the shared DB and the note/stamps sidecar.
        const selectionOk = await saveSelection();
        const r = await fetch(`/api/events/${encodeURIComponent(EVENT_ID)}/pv-notes`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({items, note, stamps: stampsPayload})
        });
        const d = await r.json();
        if (selectionOk && r.ok) {
            st.textContent = `✓ saved ${d.saved}`;
            st.style.color = '#3fb950';
        } else {
            st.textContent = '✗ save failed';
            st.style.color = '#f85149';
        }
    } catch (e) {
        st.textContent = '✗ network error';
        st.style.color = '#f85149';
    }
    setTimeout(() => { st.textContent = ''; }, 3000);
}

async function loadSaved(descMap) {
    // Selection comes from the shared DB (the event page reads the same rows).
    // The pv-notes sidecar supplies only the integrated note and stamps.
    let dbItems = [];
    let notesDoc = {};
    try {
        const sel = await jget(`/api/events/${encodeURIComponent(EVENT_ID)}/pv-selection`);
        if (sel.saved) dbItems = sel.items || [];
    } catch (e) { /* no saved selection */ }
    try {
        notesDoc = await jget(`/api/events/${encodeURIComponent(EVENT_ID)}/pv-notes`);
    } catch (e) { /* no saved notes */ }

    const items = dbItems.slice(0, MAX_PVS);
    for (const it of items) {
        selected.set(it.pv, {
            pv: it.pv,
            description: it.description || descMap.get(it.pv) || '',
            unit: it.unit || '',
        });
    }
    const noteEl = document.getElementById('explorer-note');
    if (noteEl) noteEl.value = notesDoc.note || '';
    stamps = Array.isArray(notesDoc.stamps)
        ? notesDoc.stamps
            .filter(s => s && isFinite(Number(s.x)))
            .map(s => ({x: Number(s.x), text: String(s.text || '')}))
        : [];
    stamps.sort((a, b) => a.x - b.x);
    renderStampList();
    renderSelected();
}

async function addPv(pv, desc, unit, doRender = true) {
    if (!selected.has(pv)) {
        selected.set(pv, {pv, description: desc || '', unit: unit || ''});
    }
    await ensureData(pv);
    if (doRender) {
        renderSelected();
        await renderCharts();
    }
}

// ── Bootstrap ─────────────────────────────────────────
document.getElementById('pv-search').addEventListener('input', renderPvList);
document.getElementById('stamp-text').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); addStamp(); }
});

(async () => {
    updateRangeLabel();
    const descMap = await loadDescriptionMap();
    const params = new URLSearchParams(location.search);
    const urlPvs = readUrlPvs(params);

    await loadSaved(descMap);

    // Preselect the group of the alarm-linked PVs. With no URL PVs, keep
    // the existing Beam Status default (saved PVs are still charted).
    const candidatePvs = urlPvs.map(x => x.pv);
    try {
        await loadHierarchy(candidatePvs);
    } catch (e) {
        document.getElementById('pv-list').innerHTML =
            `<div class="text-danger small p-2">PV hierarchy를 불러오지 못했습니다: ${escHtml(e)}</div>`;
    }

    for (const item of urlPvs) {
        if (selected.size >= MAX_PVS) break;
        if (!selected.has(item.pv)) {
            await addPv(item.pv, item.desc || descMap.get(item.pv) || '', '', false);
        }
    }

    if (params.get('demo') === '1' && selected.size === 0) {
        await addPv('SR:G00:BEAMCURRENT_T', 'SR Beam Current', 'mA', false);
        await addPv('SR:RF:KSU3:AI48', 'KSU#3-CIR.WatFldw(l/m)', 'L/min', false);
    }

    // Anything still missing a description gets one from the alarm mapping.
    for (const it of selected.values()) {
        if (!it.description) it.description = descMap.get(it.pv) || '';
    }

    if (currentItems.length) renderPvList();
    renderSelected();
    scrollFirstSelectedPv();
    await renderCharts();
})();
</script>
